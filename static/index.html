<!doctype html>
<html><head><meta charset="utf-8"><title>PBMC Cluster Explorer</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script></head>
<body class="bg-white text-black"><main class="max-w-7xl mx-auto p-6"><h1 class="text-3xl font-bold">PBMC Cluster Explorer</h1><p class="text-gray-700 mt-1">Explore the precomputed UMAP, expression, markers, and quality metrics.</p>
<section id="meta" class="grid grid-cols-2 md:grid-cols-6 gap-3 my-5"></section>
<div class="flex flex-wrap gap-3 mb-4 items-center"><label for="cluster" class="text-gray-700">Filter cluster</label><select id="cluster" class="bg-white text-black border border-gray-300 p-2 rounded"><option value="">All clusters</option></select><label for="gene" class="text-gray-700">Gene</label><input id="gene" list="genes" placeholder="e.g. CD3D" class="bg-white text-black border border-gray-300 p-2 rounded"><datalist id="genes"></datalist><button onclick="showGene()" class="bg-blue-600 px-4 py-2 rounded">Load</button><label for="colorBy" class="text-gray-700">Color map by</label><select id="colorBy" onchange="changeColorMap()" class="bg-white text-black border border-gray-300 p-2 rounded"><option value="clusters">Cluster labels</option><option value="expression">Gene expression</option></select><span id="viewStatus" class="text-sm text-gray-700"></span></div>
<div id="plot" class="bg-white rounded"></div><section class="mt-6"><h2 class="text-xl font-semibold mb-2">Direct gene lookup</h2><div id="geneStats" class="text-sm text-gray-700 mb-3">Enter a gene above and click Load to inspect its expression in the selected cluster.</div></section><section class="mt-6"><h2 class="text-xl font-semibold mb-2">Top markers</h2><div class="flex flex-wrap gap-2 mb-2"><select id="markerCluster" onchange="loadMarkers()" class="bg-white text-black border border-gray-300 p-2 rounded"></select><input id="markerSearch" oninput="filterMarkers()" placeholder="Filter genes..." class="bg-white text-black border border-gray-300 p-2 rounded" aria-label="Filter marker genes"></div><div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="text-left text-gray-700"><th>Gene</th><th>Score</th><th>Adjusted p</th><th>Detection fraction</th><th>Mean cluster</th><th>Mean rest</th></tr></thead><tbody id="markers"></tbody></table></div></section></main>
<script>
let clusters=[];
async function get(u){let response=await fetch(u);let text=await response.text();let data;try{data=text?JSON.parse(text):{}}catch(e){throw new Error('Server returned an invalid response (HTTP '+response.status+')')}if(!response.ok)throw new Error(data.detail||'Request failed');return data}
function card(k,v){return `<div class="bg-white rounded p-3"><div class="text-gray-700 text-xs">${k}</div><div class="text-xl font-semibold">${v}</div></div>`}
async function init(){try{let m=await get('/api/meta'); clusters=m.clusters; document.getElementById('meta').innerHTML=card('Cells',m.cells)+card('Genes',m.genes)+card('Clusters',clusters.length)+card('UMAP',m.obsm.includes('X_umap')?'available':'missing')+card('Obs fields',m.obs.length)+card('Layers',m.layers.join(', ')); for(let id of ['cluster','markerCluster']) for(let c of clusters) document.getElementById(id).insertAdjacentHTML('beforeend',`<option>${c}</option>`); showUMAP(); await loadMarkers();}catch(e){document.getElementById('markers').innerHTML='<tr><td colspan="6" class="py-3 text-red-600">Unable to load markers: '+e.message+'</td></tr>'}}
function plot(points, title, color, expressionMode=false){Plotly.react('plot',[{x:points.map(p=>p.x),y:points.map(p=>p.y),mode:'markers',type:'scattergl',customdata:points.map(p=>[p.cluster,p.n_genes,p.total_counts,p.pct_mito,p.value]),text:points.map(p=>'Cluster: '+String(p.cluster??'unknown')+'<br>Genes detected: '+String(p.n_genes??'not available')+'<br>Total UMI counts: '+(Number.isFinite(Number(p.total_counts))?Number(p.total_counts).toFixed(0):'not available')+'<br>Mitochondrial reads: '+(Number.isFinite(Number(p.pct_mito))?Number(p.pct_mito).toFixed(2)+'%':'not available')+(expressionMode?'<br>Expression: '+(Number.isFinite(Number(p.value))?Number(p.value).toFixed(3):'not available'):'')),hoverinfo:'text',marker:{size:6,color:color||points.map(p=>p.cluster),colorscale:expressionMode?'YlOrRd':'Viridis',reversescale:expressionMode,showscale:expressionMode,colorbar:expressionMode?{title:'Expression level'}:undefined}}],{title,template:'plotly_white',paper_bgcolor:'#ffffff',plot_bgcolor:'#ffffff',font:{color:'#000000'},hoverlabel:{namelength:0},xaxis:{title:'UMAP 1'},yaxis:{title:'UMAP 2'}})}
async function showUMAP(){let c=document.getElementById('cluster').value; let d=await get('/api/umap'+(c?'?cluster='+c:'')); document.getElementById('colorBy').value='clusters'; document.getElementById('viewStatus').textContent='Showing cluster labels'; plot(d.points,'UMAP colored by cluster');}
async function showGene(){let g=document.getElementById('gene').value.trim();if(!g)return;try{let d=await get('/api/expression/'+encodeURIComponent(g));if(!d.points){throw new Error('Gene not found')}document.getElementById('gene').value=d.gene;document.getElementById('colorBy').value='expression';document.getElementById('viewStatus').textContent='Showing '+d.gene+' expression';let quality=await get('/api/umap');let qualityByPoint=new Map(quality.points.map(p=>[p.x+','+p.y,p]));let selected=document.getElementById('cluster').value;let visible=d.points.filter(p=>!selected||p.cluster===selected).map(p=>Object.assign({},p,qualityByPoint.get(p.x+','+p.y)||{}));plot(visible,d.gene+' expression',visible.map(p=>p.value),true);let values=visible.map(p=>p.value),expressed=values.filter(v=>v>0);document.getElementById('geneStats').innerHTML='<strong>'+d.gene+'</strong> · visible cells: '+values.length+' · detected: '+expressed.length+' ('+(values.length?100*expressed.length/values.length:0).toFixed(1)+'%) · mean expression: '+(values.length?values.reduce((a,b)=>a+b,0)/values.length:0).toFixed(3)+' · max expression: '+(values.length?Math.max(...values):0).toFixed(3)}catch(e){document.getElementById('viewStatus').textContent='Gene not found: '+g;document.getElementById('geneStats').textContent='Gene not found in the dataset.'}}
async function changeColorMap(){if(document.getElementById('colorBy').value==='expression'){let g=document.getElementById('gene').value.trim();if(g) return showGene();} await showUMAP();}
let markerRows=[];
function renderMarkers(rows){document.getElementById('markers').innerHTML=rows.map(r=>`<tr class="border-t border-slate-800"><td>${r.gene}</td><td>${r.score.toFixed(3)}</td><td>${r.p_adj.toExponential(2)}</td><td>${r.fraction.toFixed(3)}</td><td>${r.mean_cluster.toFixed(3)}</td><td>${r.mean_rest.toFixed(3)}</td></tr>`).join('') || '<tr><td colspan="6" class="py-3 text-gray-700">No matching genes</td></tr>'}
function filterMarkers(){let q=document.getElementById('markerSearch').value.trim().toLowerCase();renderMarkers(markerRows.filter(r=>r.gene.toLowerCase().includes(q)))}
async function loadMarkers(){let c=document.getElementById('markerCluster').value;if(!c)return;try{let d=await get('/api/markers/'+encodeURIComponent(c));markerRows=d.markers||[];filterMarkers()}catch(e){document.getElementById('markers').innerHTML='<tr><td colspan="6" class="py-3 text-red-600">Unable to load markers: '+e.message+'</td></tr>'}}
document.getElementById('cluster').addEventListener('change',()=>{if(document.getElementById('colorBy').value==='clusters')showUMAP();});
init();
</script></body></html>
